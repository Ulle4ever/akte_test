<style>
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: "Roboto Condensed", ui-sans-serif, system-ui, sans-serif; background: #F7F4EE; }

  /* ============================================================
     GLOBALES POLISH
     ============================================================ */
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::selection { background: rgba(196, 62, 14, 0.18); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(22, 19, 15, 0.18); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(22, 19, 15, 0.32); }

  @keyframes rsk-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes rsk-modal-in {
    from { opacity: 0; transform: scale(.97) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes rsk-sheet-in {
    from { opacity: 0; transform: translateY(100%); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes rsk-backdrop-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes rsk-pop-in {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .rsk-fade-in { animation: rsk-fade-in .28s ease-out both; }
  .rsk-modal-in { animation: rsk-modal-in .22s cubic-bezier(.16,1,.3,1) both; }
  .rsk-sheet-in { animation: rsk-sheet-in .28s cubic-bezier(.16,1,.3,1) both; }
  .rsk-backdrop-in { animation: rsk-backdrop-in .18s ease-out both; }
  .rsk-pop-in { animation: rsk-pop-in .18s cubic-bezier(.34,1.56,.64,1) both; }
  @media (min-width: 640px) {
    .rsk-sheet-in { animation: rsk-modal-in .22s cubic-bezier(.16,1,.3,1) both; }
  }

  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pl-safe { padding-left: env(safe-area-inset-left, 0px); }

  button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
</style>
